<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado — Cleber Store</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/confirmacao.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="/assets/logo-sem-fundo.png">
    <script src="/scripts/carrinho.js" defer></script>
    <script src="/scripts/confirmacao.js" defer></script>
</head>

<body>
    <header class="store-header">
        <div class="store-header-inner">
            <a href="/index.html" class="header-logo">
                <img src="/assets/logo-crop.png" alt="Cleber Store">
            </a>

            <div class="step-indicator">
                <div class="step step--done">
                    <div class="step-circle"><i class="bi bi-check-lg"></i></div>
                    <span class="step-label">Carrinho</span>
                </div>
                <div class="step-line step-line--done"></div>
                <div class="step step--done">
                    <div class="step-circle"><i class="bi bi-check-lg"></i></div>
                    <span class="step-label">Checkout</span>
                </div>
                <div class="step-line step-line--done"></div>
                <div class="step step--active">
                    <div class="step-circle">3</div>
                    <span class="step-label">Confirmação</span>
                </div>
            </div>

            <div class="secure-badge">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Compra 100% Segura</span>
            </div>
        </div>
    </header>

    <main>
        <div class="confirmacao-container">

            <div class="success-banner">
                <div class="success-icon">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div class="success-text">
                    <h1>Pedido Confirmado!</h1>
                    <p>Obrigado pela sua compra. Seu pedido foi recebido com sucesso.</p>
                    <p class="order-number">Pedido <strong>#<span id="order-number">—</span></strong></p>
                </div>
            </div>

            <div class="order-card">
                <h2 class="card-title">Itens do Pedido</h2>
                <div id="confirmacao-items"></div>

                <div class="order-totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="conf-subtotal">—</span>
                    </div>
                    <div class="total-row">
                        <span>Desconto (5%)</span>
                        <span id="conf-desconto" class="desconto-val">—</span>
                    </div>
                    <div class="total-row">
                        <span>Frete</span>
                        <span class="gratis">Grátis</span>
                    </div>
                    <div class="total-divider"></div>
                    <div class="total-row total-final">
                        <span>Total pago</span>
                        <span id="conf-total">—</span>
                    </div>
                </div>
            </div>

            <div class="delivery-card">
                <i class="bi bi-truck"></i>
                <div>
                    <p class="delivery-label">Previsão de entrega</p>
                    <p class="delivery-date" id="delivery-date">—</p>
                </div>
            </div>

            <div class="client-info" id="client-info"></div>

            <div class="confirmacao-actions">
                <a href="/pages/produto.html" class="btn-continuar">
                    <i class="bi bi-arrow-left"></i>
                    Continuar Comprando
                </a>
            </div>
        </div>
    </main>
</body>

</html>
