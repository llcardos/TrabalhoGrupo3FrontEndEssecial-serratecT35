<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/produto.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="/assets/logo-sem-fundo.png">
    <script src="/scripts/carrinho.js" defer></script>
    <script src="/scripts/produto.js" defer></script>
</head>

<body>
    <header>
        <section>
            <div class="nav">
                <nav class="nav-categorias">
                    <ol id="lista-categorias">
                        <a href="../index.html">
                            <img src="/assets/logo-sem-fundo.png" alt="logo">
                        </a>
                    </ol>
                </nav>
                <nav class="nav-info">
                    <ul>
                        <li><a href="/pages/login.html" id="login">Login</a></li>
                        <li><a href="/pages/carrinho.html" id="carrinho" style="position:relative">Carrinho<span
                                    class="cart-badge">0</span></a></li>
                    </ul>
                </nav>
            </div>
        </section>
    </header>
    <main>
        <div class="imagem-fundo">
            <img src="/assets/fundo2.png" alt="Fundo Cleber Store">
        </div>
        <section class="produtos-section">
            <div class="produtos-header">
                <div class="produtos-titulo">
                    <span class="novidades-label">NOVIDADES</span>
                    <h1>Peças selecionadas</h1>
                    <p>Itens essenciais para elevar seu estilo em qualquer ocasião.</p>
                </div>
            </div>
            <div class="produtos-grid" id="produtos-grid"></div>
        </section>
        <section class="features-bar">
            <div class="feature">
                <i class="bi bi-truck"></i>
                <div>
                    <strong>ENVIO RÁPIDO</strong>
                    <p>Para todo o Brasil</p>
                </div>
            </div>
            <div class="feature">
                <i class="bi bi-patch-check"></i>
                <div>
                    <strong>QUALIDADE PREMIUM</strong>
                    <p>Peças selecionadas com cuidado</p>
                </div>
            </div>
            <div class="feature">
                <i class="bi bi-arrow-repeat"></i>
                <div>
                    <strong>TROCAS FÁCEIS</strong>
                    <p>Até 7 dias após o recebimento</p>
                </div>
            </div>
            <div class="feature">
                <i class="bi bi-lock"></i>
                <div>
                    <strong>COMPRA SEGURA</strong>
                    <p>Seus dados sempre protegidos</p>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
