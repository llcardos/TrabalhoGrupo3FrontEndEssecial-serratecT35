<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleber Store</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/view.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="scripts/view.js" defer></script>
    <script src="scripts/carrinho.js" defer></script>
    <link rel="icon" href="/assets/logo-sem-fundo.png">
</head>

<body>
    <header>
        <section>
            <div class="nav">
                <a href="../index.html">
                    <img src="/assets/logo-crop.png" alt="logo">
                </a>
                <div class="nav-itens">
                    <nav class="nav-info">
                        <ul>
                            <li>
                                <a href="/pages/login.html" id="login">
                                    <i class="bi bi-person icone-mobile"></i>
                                    <span class="texto-desktop">Login</span>
                                </a>
                            </li>
                            <li>
                                <a href="/pages/carrinho.html" id="carrinho" style="position:relative">
                                    <i class="bi bi-cart icone-mobile"></i>
                                    <span class="texto-desktop">Carrinho</span>
                                    <span class="cart-badge">0</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </section>
    </header>
    <main>
        <img src="/assets/fundo.png" alt="imagem de fundo" class="imagem-fundo">

        <div class="container-info">
            <div class="texto-1">
                <p>SEU ESTILO, SUA ESSÊNCIA</p>
            </div>
            <div class="texto-2">
                <span>Vista quem você <span class="texto-2-destaque">é</span></span>
            </div>
            <div class="texto-3">
                <span>Peças selecionadas para todos os momentos da sua vida.</span>
            </div>
            <div class="button">
                <a href="/pages/produto.html">
                    <button type="submit">
                        <span class="">Ver coleção</span>
                        <span class="bi bi-arrow-right"></span>
                    </button>
                </a>
            </div>
            <div class="container-icons">
                <div class="icon-first">
                    <span class="bi bi-truck"></span>
                    <span class="container-icons-text-upper">Envio rápido</span>
                    <span class="container-icons-text">Para todo o Brasil</span>
                </div>
                <div class="icon-second">
                    <span class="bi bi-bookmark-star"></span>
                    <span class="container-icons-text-upper">Qualidade</span>
                    <span class="container-icons-text">que você merece</span>
                </div>
                <div class="icon-third">
                    <span class="bi bi-shield-lock"></span>
                    <span class="container-icons-text-upper">Compra segura</span>
                    <span class="container-icons-text">seus dados protegidos</span>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
